spring.application.name=student

# Critical: Configures dynamic server port binding for Render/Cloud environments with 8080 fallback for local development. If misconfigured, cloud container routing and health checks will fail.
server.port=${PORT:8080}

# ==========================================
# DATASOURCE CONFIGURATION
# ==========================================
# Critical: Configures database JDBC URL and credentials with environment variable resolution and local fallback. If misconfigured, the application cannot connect to PostgreSQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_student}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:admin}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
# Automatically updates the database schema based on your @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Optimizes the SQL generation specifically for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Prints executed SQL queries to the console log (useful for development)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
